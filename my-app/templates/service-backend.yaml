apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-backend-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-backend
  ports:
    - name: {{ .Values.containers.backend.name }}-port
      protocol: TCP
      port: 80
      targetPort: {{ .Values.containers.backend.port }}
