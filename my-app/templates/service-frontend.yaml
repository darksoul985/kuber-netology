apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-frontend-svc
  namespace: {{ .Release.Namespace }}
spec:
  type: {{ .Values.service.type }}
  selector:
    app: {{ .Release.Name }}-frontend
  ports:
    - name: {{ .Values.containers.frontend.name }}-port
      protocol: TCP
      port: 80
      targetPort: {{ .Values.containers.frontend.port }}
