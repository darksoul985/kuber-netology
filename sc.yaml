apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: task-sc
provisioner: kubernetes.io/no-provisioner 
volumeBindingMode: WaitForFirstConsumer
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: task-pvc
spec:
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: task-sc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-sc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: task-deployment
  template:
    metadata:
      labels:
        app: task-deployment
    spec:
      containers:
      - name: write-container
        image: busybox
        command: ["/bin/sh", "-c"] 
        args: ["echo $(date) > /data/input/write; sleep 3600"] # КЛЮЧЕВОЕ: Команда для чтения данных из файла, расположенного в директории, указанной в volumeMounts контейнера
        volumeMounts:
        - name: task-vol
          mountPath: /data/input
      - name: read-container
        image: busybox
        command: ["/bin/sh", "-c"]
        args: ["tail -f /data/output/write"] # КЛЮЧЕВОЕ: Команда для чтения данных из файла, расположенного в директории, указанной в volumeMounts контейнера
        volumeMounts:
        - name: task-vol
          mountPath: /data/output
      volumes:
      - name: task-vol
        persistentVolumeClaim:
          claimName: task-pvc
