apiVersion: v1
kind: Pod
metadata:
  name: checker
  labels:
    app: checker
spec:
  restartPolicy: Never
  containers:
    - name: checker
      image: curlimages/curl:latest
      command: ["/bin/sh", "-c"]
      args:
        - |
          set -e
          echo "🌐 Testing HTTP connectivity..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 5 --max-time 10 http://$TARGET_SVC)
          echo "📊 HTTP Status: $STATUS"

          if [[ "$STATUS" =~ ^[23][0-9][0-9]$ ]]; then
            echo "🎉 SUCCESS: Application is reachable!"
            exit 0
          else
            echo "💥 FAILURE: Expected 2xx/3xx, got $STATUS"
            exit 1
          fi
      env:
        - name: TARGET_SVC
          value: "nginx-multitool-svc.default.svc.cluster.local"
